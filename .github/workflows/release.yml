name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows installers
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare diarization runtime
        run: npm run setup:diarize-cpu

      - name: Prepare FFmpeg sidecar
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match "\\bin\\ffmpeg\.exe$" } |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found after Chocolatey install"
          }
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe" -Force

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Meeting Minutes AI ${{ env.RELEASE_TAG }}"
          releaseBody: "Windows installers generated by GitHub Actions. Use the NSIS setup EXE for the normal install flow. The optimized diarization runtime is bundled in the installer."
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          retryAttempts: 1
          uploadPlainBinary: false
